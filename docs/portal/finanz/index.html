<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinanzOps</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#2563EB">
    <style>
      /* v3.1 — components built on tokens.css */
      .cat-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: var(--surface-muted);
        color: var(--text-muted);
        border-radius: var(--radius-pill);
        flex-shrink: 0;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: var(--text-xs);
        line-height: 1;
        font-weight: 500;
        padding: 3px 8px;
        border-radius: var(--radius-pill);
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }
      .pill-paid     { background: var(--success-soft); color: var(--success); }
      .pill-pending  { background: var(--warning-soft); color: var(--warning); }
      .pill-overdue  { background: var(--danger-soft);  color: var(--danger);  }
      .pill-neutral  { background: var(--surface-muted); color: var(--text-muted); }
      .pill-accent   { background: var(--accent-soft);   color: var(--accent); }

      .dot { display: inline-block; width: 8px; height: 8px; border-radius: 999px; }
      .dot-success { background: var(--success); }
      .dot-warning { background: var(--warning); }
      .dot-danger  { background: var(--danger);  }
      .dot-muted   { background: var(--text-subtle); }

      .delta-up   { color: var(--danger); }   /* spending up = bad */
      .delta-down { color: var(--success); }   /* spending down = good */

      .metric-card {
        display: flex; flex-direction: column; gap: var(--space-2);
        padding: var(--space-5);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        background: transparent;
        transition: border-color var(--transition);
      }
      .metric-card:hover { border-color: var(--border-strong); }
      .metric-card .label {
        font-size: var(--text-xs);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-subtle);
      }
      .metric-card .value {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-variant-numeric: tabular-nums;
        font-size: var(--text-xl);
        font-weight: 600;
        color: var(--text);
        letter-spacing: -0.02em;
      }
      .metric-card .delta {
        font-size: var(--text-xs);
        color: var(--text-muted);
      }

      .progress-gutter {
        position: relative;
        height: 4px;
        background: var(--surface-muted);
        border-radius: 2px;
        overflow: hidden;
      }
      .progress-gutter > .fill {
        position: absolute;
        top: 0; left: 0; bottom: 0;
        background: var(--accent);
        opacity: 0.7;
        transition: width var(--transition);
      }
      .progress-gutter > .fill.over { background: var(--danger); opacity: 0.85; }

      .row-table {
        width: 100%;
        border-collapse: collapse;
        font-size: var(--text-sm);
      }
      .row-table th {
        text-align: left;
        font-weight: 500;
        font-size: var(--text-xs);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-subtle);
        padding: var(--space-2) var(--space-3);
        border-bottom: 1px solid var(--border);
      }
      .row-table td {
        padding: var(--space-3);
        border-bottom: 1px solid var(--border);
        color: var(--text);
      }
      .row-table td.num { text-align: right; }
      .row-table tr:hover td { background: var(--surface-muted); cursor: pointer; }
      .row-table tr:last-child td { border-bottom: none; }

      .grid-cards {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: var(--space-3);
      }

      /* User identity chips (subtle, no gradients) */
      .user-chip-aaron .avatar { background: var(--user-aaron); }
      .user-chip-bela  .avatar { background: var(--user-bela); }
    </style>
    <script>
        // Theme init — prevent flash
        (function() {
            var t = localStorage.getItem('portal_theme') || 'light';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
</head>
